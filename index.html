    cx.moveTo(-r*0.4,r*0.3);cx.lineTo(-r*0.55,r*0.75);cx.stroke();
    cx.fillStyle='#ff5566';cx.fillRect(-r*0.57,-r*0.78,3,3);cx.fillRect(-r*0.57,r*0.75,3,3);
    // heavy underslung nacelle assemblies
    nacelle(-r*0.25,-r*0.86,r*1.35,r*0.26,bodyCol,accent);
    nacelle(-r*0.25, r*0.86,r*1.35,r*0.26,bodyCol,accent);
    thrusters(-r*0.92,[-r*0.86,r*0.86],r*0.22,'rgba(255,120,100,0.9)');
    // dense dorsal module massing
    moduleStack(-r*0.7,-r*0.36,r*1.1,r*0.18,7,bodyCol);
    moduleStack(-r*0.7, r*0.36,r*1.1,r*0.18,7,bodyCol);
    moduleStack(-r*0.35,-r*0.02,r*0.7,r*0.14,4,bodyCol);
    hullIdent(-r*0.28,r*0.2,r*0.2,'#d2dae5',1);
    // engine nozzles as heavy thruster banks
    thrusters(-r*1.12,[-r*0.41,0,r*0.41],r*0.24,'rgba(255,100,90,0.9)');
  }
  cx.restore();
  // --- heavy-lance charge telegraph: a growing warning beam aimed at the player ---
  if(e.charging){
    const cf=clamp(e.charge/1.4,0,1);
    const a=e.chargeAim;
    const len=Math.max(W,H);
    cx.save();cx.translate(e.x,e.y);cx.rotate(a);
    // thin warning line that thickens as it charges
    cx.strokeStyle='rgba(255,40,70,'+(0.15+cf*0.5)+')';
    cx.lineWidth=1+cf*10;
    cx.beginPath();cx.moveTo(e.r,0);cx.lineTo(len,0);cx.stroke();
    // charging core glow at the muzzle
    const gl=cx.createRadialGradient(e.r,0,0,e.r,0,10+cf*16);
    gl.addColorStop(0,'rgba(255,120,140,'+(0.5+cf*0.5)+')');gl.addColorStop(1,'rgba(255,40,70,0)');
    cx.fillStyle=gl;cx.beginPath();cx.arc(e.r,0,10+cf*16,0,TAU);cx.fill();
    cx.restore();
  }
  // --- attached boarder: bright pulsing hazard marker so it can't hide on the hull ---
  if(e.type==='boarder'&&e.attached){
    const p=(Math.sin(t*9)+1)/2;
    cx.strokeStyle='rgba(90,255,150,'+(0.6+p*0.4)+')';cx.lineWidth=2.5;
    cx.beginPath();cx.arc(e.x,e.y,e.r+7+p*3,0,TAU);cx.stroke();
    // targeting ticks
    cx.strokeStyle='rgba(120,255,170,0.8)';cx.lineWidth=2;
    for(let q=0;q<4;q++){const qa=q*Math.PI/2+t*2;
      cx.beginPath();
      cx.moveTo(e.x+Math.cos(qa)*(e.r+10),e.y+Math.sin(qa)*(e.r+10));
      cx.lineTo(e.x+Math.cos(qa)*(e.r+16),e.y+Math.sin(qa)*(e.r+16));cx.stroke();}
    cx.fillStyle='rgba(90,255,150,'+(0.5+p*0.5)+')';cx.font='bold 9px Orbitron,monospace';cx.textAlign='center';
    cx.fillText('BREACHER',e.x,e.y-e.r-12);
  }
  // --- boss subsystem markers (drawn in world space over the hull) ---
  if(e.subs){
    for(const sb of e.subs){
      const P=subPos(e,sb);
      if(sb.dead){
        // blown-off module: charred socket venting fire
        cx.fillStyle='rgba(20,10,8,0.9)';
        cx.beginPath();cx.arc(P.x,P.y,P.r*0.8,0,TAU);cx.fill();
        if(Math.random()<0.35){
          cx.fillStyle='rgba(255,'+(120+Math.random()*80|0)+',40,'+(0.3+Math.random()*0.4)+')';
          cx.beginPath();cx.arc(P.x+rand(-P.r*0.4,P.r*0.4),P.y+rand(-P.r*0.4,P.r*0.4),rand(2,P.r*0.45),0,TAU);cx.fill();
        }
        if(Math.random()<0.25)G.parts.push({x:P.x,y:P.y,vx:rand(-25,25),vy:rand(-25,25),life:rand(0.4,0.9),col:Math.random()<0.5?'#553':'#ff7722',sz:rand(2,4)});
      }else{
        // live weak point: targeting bracket + integrity ring
        const f2=sb.hp/sb.max;
        cx.strokeStyle='rgba(255,210,120,'+(0.35+0.35*(1-f2))+')';cx.lineWidth=1.6;
        cx.beginPath();cx.arc(P.x,P.y,P.r,0,TAU);cx.stroke();
        // integrity arc
        cx.strokeStyle=f2>0.5?'rgba(120,255,180,0.75)':f2>0.25?'rgba(255,200,80,0.8)':'rgba(255,80,80,0.85)';
        cx.lineWidth=2.6;
        cx.beginPath();cx.arc(P.x,P.y,P.r+3,-Math.PI/2,-Math.PI/2+TAU*f2);cx.stroke();
        // corner ticks
        cx.strokeStyle='rgba(255,220,150,0.5)';cx.lineWidth=1.2;
        for(let q=0;q<4;q++){const qa=q*Math.PI/2+Math.PI/4;
          cx.beginPath();
          cx.moveTo(P.x+Math.cos(qa)*(P.r+5),P.y+Math.sin(qa)*(P.r+5));
          cx.lineTo(P.x+Math.cos(qa)*(P.r+9),P.y+Math.sin(qa)*(P.r+9));cx.stroke();}
      }
    }
  }
  // hp bar (+ affix shield bar and name tag)
  if(e.maxHp>60||e.affix){
    let by=e.y-e.r-11;
    if(e.eshield>0){
      cx.fillStyle='rgba(0,0,0,0.55)';cx.fillRect(e.x-e.r,by-6,e.r*2,3.5);
      cx.fillStyle='#66aaff';cx.fillRect(e.x-e.r,by-6,e.r*2*(e.eshield/e.maxEshield),3.5);
    }
    cx.fillStyle='rgba(0,0,0,0.55)';cx.fillRect(e.x-e.r,by,e.r*2,4.5);
    cx.fillStyle=hpFrac>0.4?T.col:'#ff2233';cx.fillRect(e.x-e.r,by,e.r*2*hpFrac,4.5);
    if(e.affix){
      cx.textAlign='center';cx.font='bold 9px Orbitron,monospace';
      cx.fillStyle=e.affixCol;cx.fillText(e.affixName,e.x,by-(e.eshield>0?11:5));
    }
  }
}
function hexA(hex,a){
  const n=parseInt(hex.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  const r=clamp(((n>>16)&255)*f,0,255)|0,g=clamp(((n>>8)&255)*f,0,255)|0,b=clamp((n&255)*f,0,255)|0;
  return 'rgb('+r+','+g+','+b+')';
}

// ============================================================
// RENDER
// ============================================================
function draw(){
  cx.fillStyle='#04040a';cx.fillRect(0,0,W,H);
  if(state===ST.BOOT)return drawBoot();
  if(state===ST.MENU)return drawMenu();
  if(state===ST.HANGAR)return drawHangar();
  if(state===ST.SETTINGS)return drawSettings();
  if(state===ST.CODEX)return drawCodex();
  if(state===ST.META)return drawMeta();
  if(!G)return;
  if(state===ST.SECTOR)return drawSector();
  if(state===ST.SHIPYARD)return drawShipyard();
  if(state===ST.ROUTE)return drawRoute();

  cx.save();
  const shk=shake*save.settings.shake;
  const sx=rand(-shk,shk),sy=rand(-shk,shk);
  // camera PUNCH — a brief zoom kick on heavy impacts adds weight
  if(punch>0.001){cx.translate(W/2,H/2);cx.scale(1+punch,1+punch);cx.translate(-W/2,-H/2);}
  cx.translate(W/2-G.px+sx,H/2-G.py+sy);

  // --- parallax stars (3 layers, subtle twinkle) ---
  for(let L=0;L<3;L++){
    const z=0.25+L*0.3, baseA=0.18+L*0.18;
    for(let si=0;si<G.stars[L].length;si++){
      const s=G.stars[L][si];
      const x=G.px+((s.x-G.px*z)%2400+3600)%2400-1200;
      const y=G.py+((s.y-G.py*z)%2400+3600)%2400-1200;
      const tw=0.65+0.35*Math.sin(t*1.6+si*1.3+L);   // slow per-star shimmer
      cx.fillStyle='rgba(170,195,255,'+(baseA*tw)+')';
      cx.fillRect(x,y,L===2?2:1,L===2?2:1);
    }
  }
  // --- animated per-sector backdrop (drawn behind everything) ---
  drawBackdrop();
  // --- sector environment ---
  bakeBudget=(QUALITY>=1)?2:0;   // bake up to 2 asteroid sprites per frame (spread cost, no hitch)
  for(const o of G.env){
    const x=G.px+((o.x-G.px*o.z)%3000+4500)%3000-1500;
    const y=G.py+((o.y-G.py*o.z)%3000+4500)%3000-1500;
    if(o.kind==='asteroids'){
      const rr=o.r, rot=o.rot+t*o.spin, np=o.pts.length;
      // --- photoreal path: draw the pre-baked bump-lit sprite (rotating, tumbling rock) ---
      if(!o.sprite&&bakeBudget>0){bakeBudget--;bakeAsteroidSprite(o);}
      if(o.sprite){
        cx.save();cx.translate(x,y);cx.rotate(rot);
        const hw=o.spriteHalf;   // sprite already sized in world units
        cx.drawImage(o.sprite,-hw,-hw,hw*2,hw*2);
        // battle damage: glowing fracture as HP drops
        if(o.maxHp&&o.hp<o.maxHp*0.6){const dmgF=1-o.hp/o.maxHp;
          cx.strokeStyle='rgba(255,'+(140-dmgF*80|0)+',60,'+(0.3+dmgF*0.5)+')';cx.lineWidth=1.5;
          cx.beginPath();cx.moveTo(-rr*0.6,-rr*0.3);cx.lineTo(-rr*0.1,rr*0.1);cx.lineTo(rr*0.4,-rr*0.2);cx.stroke();}
        cx.restore();
        continue;
      }
      // --- fallback vector path (until the sprite bakes) ---
      const Lx=-0.6,Ly=-0.55;
      const tn=o.tone||1;
      cx.save();cx.translate(x,y);
      // silhouette path (rotated points computed in JS)
      cx.beginPath();
      for(let k=0;k<np;k++){const a=k/np*TAU+rot;const rad=o.pts[k];
        const px=Math.cos(a)*rad,py=Math.sin(a)*rad;k?cx.lineTo(px,py):cx.moveTo(px,py);}
      cx.closePath();
      cx.save();cx.clip();
      // base fill: offset radial gradient = day/terminator/night (fixed direction)
      const g1=cx.createRadialGradient(Lx*rr*0.7,Ly*rr*0.7,rr*0.15,0,0,rr*1.35);
      g1.addColorStop(0,shade('#7a8496',tn));
      g1.addColorStop(0.45,shade('#4a5361',tn));
      g1.addColorStop(0.78,shade('#2b313c',tn));
      g1.addColorStop(1,shade('#12151c',tn));
      cx.fillStyle=g1;cx.fillRect(-rr*1.4,-rr*1.4,rr*2.8,rr*2.8);
      // surface speckles (albedo grain) — rotate with the rock
      for(const sp of o.speck){const a=sp.a+rot;const sx=Math.cos(a)*sp.d,sy=Math.sin(a)*sp.d;
        // dim grains on the night side
        const lit=(-(sx/rr)*Lx-(sy/rr)*Ly);const shd=clamp(0.5+lit*0.6,0.15,1);
        cx.fillStyle='rgba('+(sp.b>0?'200,205,215,':'20,22,28,')+(Math.abs(sp.b)*shd*1.6).toFixed(2)+')';
        cx.fillRect(sx-sp.s/2,sy-sp.s/2,sp.s,sp.s);}
      // craters — lit rim toward the light, shadowed floor away from it
      for(const cr of o.craters){const a=cr.a+rot;const cxr=Math.cos(a)*cr.d,cyr=Math.sin(a)*cr.d,pr=cr.r;
        // bowl shadow
        const cg=cx.createRadialGradient(cxr-Lx*pr*0.3,cyr-Ly*pr*0.3,pr*0.1,cxr,cyr,pr);
        cg.addColorStop(0,'rgba(0,0,0,0.5)');cg.addColorStop(0.7,'rgba(0,0,0,0.22)');cg.addColorStop(1,'rgba(0,0,0,0)');
        cx.fillStyle=cg;cx.beginPath();cx.arc(cxr,cyr,pr,0,TAU);cx.fill();
        // lit rim arc facing the light
        const la=Math.atan2(Ly,Lx);
        cx.strokeStyle='rgba(200,210,225,0.35)';cx.lineWidth=1.4;
        cx.beginPath();cx.arc(cxr,cyr,pr*0.92,la-1.1,la+1.1);cx.stroke();
        // shadowed rim opposite
        cx.strokeStyle='rgba(0,0,0,0.4)';cx.lineWidth=1.6;
        cx.beginPath();cx.arc(cxr,cyr,pr*0.92,la+Math.PI-1.0,la+Math.PI+1.0);cx.stroke();}
      // ambient-occlusion vignette on the far/night edge (fixed direction)
      const ao=cx.createRadialGradient(-Lx*rr*0.5,-Ly*rr*0.5,rr*0.4,-Lx*rr*0.5,-Ly*rr*0.5,rr*1.5);
      ao.addColorStop(0,'rgba(0,0,0,0)');ao.addColorStop(1,'rgba(0,0,0,0.55)');
      cx.fillStyle=ao;cx.fillRect(-rr*1.4,-rr*1.4,rr*2.8,rr*2.8);
      // battle damage: hot glowing fracture as HP drops
      if(o.maxHp&&o.hp<o.maxHp*0.6){
        const dmgF=1-o.hp/o.maxHp;
        cx.strokeStyle='rgba(255,'+(140-dmgF*80|0)+',60,'+(0.3+dmgF*0.5)+')';cx.lineWidth=1.5;
        cx.beginPath();cx.moveTo(-rr*0.6,-rr*0.3);cx.lineTo(-rr*0.1,rr*0.1);cx.lineTo(rr*0.4,-rr*0.2);
        cx.moveTo(rr*0.1,rr*0.5);cx.lineTo(-rr*0.05,-rr*0.1);cx.stroke();
      }
      cx.restore();
      // crisp lit rim highlight along the silhouette toward the light
      cx.beginPath();
      for(let k=0;k<np;k++){const a=k/np*TAU+rot;const rad=o.pts[k];
        const px=Math.cos(a)*rad,py=Math.sin(a)*rad;k?cx.lineTo(px,py):cx.moveTo(px,py);}
      cx.closePath();
      cx.strokeStyle='rgba(190,205,230,0.5)';cx.lineWidth=1.4;cx.stroke();
      cx.restore();
    }else if(o.kind==='livemine'){
      cx.save();cx.translate(x,y);cx.rotate(t*0.6);
      // spiked mine body
      cx.fillStyle='#3a2f28';cx.strokeStyle='rgba(200,170,140,0.5)';cx.lineWidth=1;
      cx.beginPath();cx.arc(0,0,o.r*0.7,0,TAU);cx.fill();cx.stroke();
      cx.strokeStyle='#5a4a3a';cx.lineWidth=2;
      for(let k=0;k<6;k++){const a=k/6*TAU;
        cx.beginPath();cx.moveTo(Math.cos(a)*o.r*0.6,Math.sin(a)*o.r*0.6);
        cx.lineTo(Math.cos(a)*o.r*1.1,Math.sin(a)*o.r*1.1);cx.stroke();}
      // arming light: green idle -> fast red blink when armed
      const blink=o.arm>0.1?(Math.sin(t*(6+o.arm*20))>0):(Math.sin(t*2)>0);
      const col=o.arm>0.1?'rgba(255,50,50,':'rgba(90,255,120,';
      cx.fillStyle=col+(blink?'1':'0.2')+')';
      cx.beginPath();cx.arc(0,0,o.r*0.28,0,TAU);cx.fill();
      cx.restore();
      // proximity warning ring when arming
      if(o.arm>0.15){cx.strokeStyle='rgba(255,60,60,'+(o.arm*0.4)+')';cx.lineWidth=1.5;
        cx.beginPath();cx.arc(x,y,o.r+8+o.arm*10,0,TAU);cx.stroke();}
    }else if(o.kind==='planet'){
      // --- properly lit gas giant: bright sunlit crescent, deep night side ---
      const r=o.r, Lx=-0.5,Ly=-0.55;               // light from upper-left
      const hue=o.hue;
      // atmospheric halo behind the disc
      const halo=cx.createRadialGradient(x,y,r*0.92,x,y,r*1.14);
      halo.addColorStop(0,'hsla('+hue+',65%,60%,0.16)');
      halo.addColorStop(1,'hsla('+hue+',65%,55%,0)');
      cx.fillStyle=halo;cx.beginPath();cx.arc(x,y,r*1.14,0,TAU);cx.fill();
      // full-lit base colour
      cx.fillStyle='hsl('+hue+',45%,42%)';
      cx.beginPath();cx.arc(x,y,r,0,TAU);cx.fill();
      cx.save();cx.beginPath();cx.arc(x,y,r,0,TAU);cx.clip();
      // curved latitudinal cloud bands (soft ellipse strokes, follow curvature)
      cx.globalAlpha=0.5;
      for(let b=-4;b<=4;b++){
        const by=y+b*r*0.2, w=Math.sqrt(Math.max(0,r*r-(b*r*0.2)*(b*r*0.2)));
        cx.strokeStyle=(b%2? 'hsla('+hue+',55%,58%,0.5)':'hsla('+((hue+18)%360)+',50%,32%,0.5)');
        cx.lineWidth=r*0.11;
        cx.beginPath();cx.ellipse(x,by+Math.sin(b*1.3+o.rot)*r*0.03,w,r*0.09,0,0,TAU);cx.stroke();
      }
      cx.globalAlpha=1;
      // day→night terminator: a clean LINEAR gradient across the sphere along the light axis
      const nx=-Lx,ny=-Ly;                           // toward the night side
      const term=cx.createLinearGradient(x-nx*r,y-ny*r, x+nx*r,y+ny*r);
      term.addColorStop(0.0,'rgba(0,0,0,0)');
      term.addColorStop(0.45,'rgba(0,0,0,0)');
      term.addColorStop(0.72,'rgba(3,4,9,0.4)');
      term.addColorStop(1.0,'rgba(2,3,7,0.8)');
      cx.fillStyle=term;cx.fillRect(x-r,y-r,r*2,r*2);
      // soft radial darkening at the very limb (gives the sphere its roundness)
      const edge=cx.createRadialGradient(x,y,r*0.7,x,y,r);
      edge.addColorStop(0,'rgba(0,0,0,0)');edge.addColorStop(1,'rgba(0,0,0,0.32)');
      cx.fillStyle=edge;cx.fillRect(x-r,y-r,r*2,r*2);
      // bright specular sheen on the sunlit shoulder
      const sheen=cx.createRadialGradient(x+Lx*r*0.5,y+Ly*r*0.5,0,x+Lx*r*0.5,y+Ly*r*0.5,r*0.9);
      sheen.addColorStop(0,'hsla('+hue+',60%,82%,0.35)');sheen.addColorStop(1,'hsla('+hue+',60%,72%,0)');
      cx.fillStyle=sheen;cx.fillRect(x-r,y-r,r*2,r*2);
      cx.restore();
      // thin bright atmosphere arc on the lit limb (crescent glow)
      const la=Math.atan2(Ly,Lx);
      cx.strokeStyle='hsla('+hue+',80%,82%,0.55)';cx.lineWidth=2.4;
      cx.beginPath();cx.arc(x,y,r*0.99,la-1.5,la+1.5);cx.stroke();
      if(o.ring){cx.save();cx.translate(x,y);cx.rotate(0.4);cx.scale(1,0.26);
        cx.strokeStyle='hsla('+hue+',40%,72%,0.28)';cx.lineWidth=r*0.16;cx.beginPath();cx.arc(0,0,r*1.55,0,TAU);cx.stroke();cx.restore();}
    }else if(o.kind==='moon'){
      const g1=cx.createRadialGradient(x-o.r*0.35,y-o.r*0.35,o.r*0.1,x,y,o.r);
      g1.addColorStop(0,shade('#8a8f9a',o.tone));g1.addColorStop(0.7,shade('#4a4f58',o.tone));g1.addColorStop(1,'#14161c');
      cx.fillStyle=g1;cx.beginPath();cx.arc(x,y,o.r,0,TAU);cx.fill();
    }else if(o.kind==='farwreck'){
      // distant hulk silhouette, barely lit
      cx.save();cx.translate(x,y);cx.rotate(o.rot);
      cx.fillStyle='rgba(16,18,26,0.85)';cx.strokeStyle='rgba(80,90,110,0.3)';cx.lineWidth=1.5;
      const r=o.r;
      shipPath([r,0, r*0.4,-r*0.16, -r*0.3,-r*0.2, -r*0.9,-r*0.1, -r,0, -r*0.5,r*0.12, r*0.4,r*0.14]);
      cx.fill();cx.stroke();
      // a couple of dead-light flickers
      if(Math.random()<0.015){cx.fillStyle='rgba(255,150,80,0.5)';cx.fillRect(rand(-r*0.5,r*0.5),rand(-r*0.1,r*0.1),3,3);}
      cx.restore();
    }else if(o.kind==='comet'){
      // icy nucleus with a glowing tail trailing opposite its motion
      const ta=Math.atan2(-o.vy,-o.vx),tl=90;
      const tg=cx.createLinearGradient(x,y,x+Math.cos(ta)*tl,y+Math.sin(ta)*tl);
      tg.addColorStop(0,'rgba(150,220,255,0.5)');tg.addColorStop(1,'rgba(150,220,255,0)');
      cx.strokeStyle=tg;cx.lineWidth=o.r*1.6;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+Math.cos(ta)*tl,y+Math.sin(ta)*tl);cx.stroke();
      const gl=cx.createRadialGradient(x,y,0,x,y,o.r*3);
      gl.addColorStop(0,'#eaffff');gl.addColorStop(1,'rgba(150,220,255,0)');
      cx.fillStyle=gl;cx.beginPath();cx.arc(x,y,o.r*3,0,TAU);cx.fill();
    }else if(o.kind==='wisp'){
      // soft volumetric cloud you fly through — pulses & drifts; nearer ones read stronger
      const pulse=0.6+Math.sin(t*0.3+o.ph)*0.4, wx=x+Math.sin(t*0.1+o.ph)*o.drift*3;
      const a=(0.05+o.z*0.06)*pulse;
      const gr=cx.createRadialGradient(wx,y,0,wx,y,o.r);
      gr.addColorStop(0,'hsla('+o.hue+',65%,60%,'+a+')');
      gr.addColorStop(0.6,'hsla('+o.hue+',65%,52%,'+(a*0.5)+')');
      gr.addColorStop(1,'hsla('+o.hue+',65%,50%,0)');
      cx.fillStyle=gr;cx.beginPath();cx.arc(wx,y,o.r,0,TAU);cx.fill();
    }else if(o.kind==='dust'){
      cx.fillStyle='hsla('+o.hue+',60%,75%,0.28)';
      cx.fillRect(x,y,o.r,o.r);
    }else if(o.kind==='scrap'){
      cx.save();cx.translate(x,y);cx.rotate(o.rot+t*o.spin);
      cx.fillStyle='#2b3140';cx.strokeStyle='rgba(140,160,190,0.35)';cx.lineWidth=1;
      if(o.shape===0){cx.fillRect(-o.r,-o.r*0.35,o.r*2,o.r*0.7);cx.strokeRect(-o.r,-o.r*0.35,o.r*2,o.r*0.7);
        cx.fillStyle='rgba(0,0,0,0.4)';cx.fillRect(-o.r*0.4,-o.r*0.35,o.r*0.2,o.r*0.7);}
      else if(o.shape===1){cx.beginPath();cx.moveTo(o.r,0);cx.lineTo(-o.r*0.3,-o.r*0.8);cx.lineTo(-o.r,0);cx.lineTo(-o.r*0.2,o.r*0.6);cx.closePath();cx.fill();cx.stroke();}
      else{cx.beginPath();cx.arc(0,0,o.r*0.7,0.4,TAU-0.8);cx.strokeStyle='rgba(150,170,200,0.5)';cx.lineWidth=o.r*0.3;cx.stroke();}
      cx.restore();
    }else if(o.kind==='vent'){
      const pulse=0.5+Math.sin(t*1.2+o.ph)*0.5;
      const gr=cx.createRadialGradient(x,y,0,x,y,o.r*(0.7+pulse*0.5));
      gr.addColorStop(0,'hsla('+o.hue+',80%,70%,'+(0.18*pulse)+')');
      gr.addColorStop(0.5,'hsla('+o.hue+',80%,55%,'+(0.08*pulse)+')');
      gr.addColorStop(1,'hsla('+o.hue+',80%,50%,0)');
      cx.fillStyle=gr;cx.beginPath();cx.arc(x,y,o.r*(0.7+pulse*0.5),0,TAU);cx.fill();
    }else if(o.kind==='gantry'){
      cx.save();cx.translate(x,y);cx.rotate(o.rot);
      cx.strokeStyle='rgba(90,105,130,0.5)';cx.lineWidth=3;
      const r=o.r;
      cx.strokeRect(-r*0.5,-r*0.12,r,r*0.24);
      cx.lineWidth=1.5;
      for(let k=0;k<7;k++){const gx=-r*0.5+k*r/6;
        cx.beginPath();cx.moveTo(gx,-r*0.12);cx.lineTo(gx,r*0.12);cx.stroke();}
      cx.beginPath();cx.moveTo(-r*0.5,-r*0.12);cx.lineTo(r*0.5,r*0.12);
      cx.moveTo(-r*0.5,r*0.12);cx.lineTo(r*0.5,-r*0.12);
      cx.strokeStyle='rgba(90,105,130,0.25)';cx.stroke();
      // hazard beacons
      for(const bx of [-r*0.5,r*0.5]){
        cx.fillStyle=(Math.sin(t*3+bx)>0)?'rgba(255,170,60,0.8)':'rgba(255,170,60,0.15)';
        cx.beginPath();cx.arc(bx,0,3,0,TAU);cx.fill();
      }
      cx.restore();
    }else if(o.kind==='nebula'){
      const grd=cx.createRadialGradient(x,y,0,x,y,o.r);
      grd.addColorStop(0,'hsla('+o.hue+',70%,55%,'+o.a+')');
      grd.addColorStop(1,'hsla('+o.hue+',70%,45%,0)');
      cx.fillStyle=grd;cx.beginPath();cx.arc(x,y,o.r,0,TAU);cx.fill();
    }else{ // wrecks
      cx.save();cx.translate(x,y);cx.rotate(o.rot);
      cx.fillStyle='rgba(20,24,34,0.9)';cx.strokeStyle='rgba(90,60,60,0.5)';cx.lineWidth=1.5;
      const r=o.r;
      shipPath([r,0, r*0.4,-r*0.25, -r*0.3,-r*0.3, -r*0.9,-r*0.15, -r,-r*0.02, -r*0.6,r*0.1, -r*0.2,r*0.28, r*0.5,r*0.2]);
      cx.fill();cx.stroke();
      // broken gap
      cx.fillStyle='#04040a';
      cx.fillRect(-r*0.2+o.broken*r*0.2,-r*0.35,r*0.15,r*0.7);
      // dead lights flicker
      if(Math.random()<0.02){cx.fillStyle='rgba(255,150,80,0.6)';cx.fillRect(r*0.3,-2,3,3);}
      cx.restore();
    }
  }

  // pickups (glowing)
  for(const p of G.pickups){
    const gl=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,9);
    gl.addColorStop(0,'rgba(120,210,255,0.9)');gl.addColorStop(1,'rgba(120,210,255,0)');
    cx.fillStyle=gl;cx.beginPath();cx.arc(p.x,p.y,9,0,TAU);cx.fill();
    cx.fillStyle='#cdeeff';cx.fillRect(p.x-2,p.y-2,4,4);
  }

  // bullets with additive glow trails
  cx.globalCompositeOperation='lighter';
  for(const b of G.bullets){
    if(b.trail){
      cx.strokeStyle=b.col;cx.globalAlpha=0.35;cx.lineWidth=b.r;
      cx.beginPath();cx.moveTo(b.x-b.vx*0.04,b.y-b.vy*0.04);cx.lineTo(b.x,b.y);cx.stroke();
      cx.globalAlpha=1;
    }
    if(b.mine){
      cx.strokeStyle=b.col;cx.lineWidth=1.5;
      cx.beginPath();cx.arc(b.x,b.y,b.r+Math.sin(t*6)*2,0,TAU);cx.stroke();
      cx.fillStyle='rgba(255,238,68,0.5)';cx.beginPath();cx.arc(b.x,b.y,3,0,TAU);cx.fill();
    }else if(QUALITY>=1){
      const gl=cx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*3);
      gl.addColorStop(0,b.col);gl.addColorStop(1,'rgba(0,0,0,0)');
      cx.fillStyle=gl;cx.beginPath();cx.arc(b.x,b.y,b.r*3,0,TAU);cx.fill();
    }else{
      // low quality: cheap solid dot instead of a per-bullet radial gradient
      cx.fillStyle=b.col;cx.beginPath();cx.arc(b.x,b.y,b.r,0,TAU);cx.fill();
    }
  }
  for(const b of G.ebullets){
    const rad=b.r*(b.heavy?3.4:2.6);
    const gl=cx.createRadialGradient(b.x,b.y,0,b.x,b.y,rad);
    if(b.heavy){gl.addColorStop(0,'#ffdd66');gl.addColorStop(0.4,'#ff5544');gl.addColorStop(1,'rgba(255,0,40,0)');}
    else{gl.addColorStop(0,'#ff4455');gl.addColorStop(1,'rgba(255,0,40,0)');}
    cx.fillStyle=gl;cx.beginPath();cx.arc(b.x,b.y,rad,0,TAU);cx.fill();
    if(b.heavy){cx.fillStyle='#fff';cx.beginPath();cx.arc(b.x,b.y,b.r*0.5,0,TAU);cx.fill();}
  }
  // shockwave rings
  for(const r of G.rings){
    cx.strokeStyle=r.col;cx.globalAlpha=Math.max(0,r.life*2.8);cx.lineWidth=2.5;
    cx.beginPath();cx.arc(r.x,r.y,r.r,0,TAU);cx.stroke();cx.globalAlpha=1;
  }
  cx.globalCompositeOperation='source-over';

  // debris chunks
  for(const d of G.debris){
    cx.save();cx.translate(d.x,d.y);cx.rotate(d.rot);
    cx.globalAlpha=Math.min(1,d.life);
    cx.fillStyle=d.col;cx.fillRect(-d.sz/2,-d.sz/2,d.sz,d.sz*0.6);
    cx.restore();
  }
  cx.globalAlpha=1;

  // ships
  for(const e of G.enemies)drawEnemyShip(e);
  drawPlayerShip(G);

  // particles
  cx.globalCompositeOperation='lighter';
  for(const p of G.parts){
    cx.globalAlpha=Math.max(0,p.life);
    if(p.glow){
      const gl=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.sz*2);
      gl.addColorStop(0,p.col);gl.addColorStop(1,'rgba(0,0,0,0)');
      cx.fillStyle=gl;cx.beginPath();cx.arc(p.x,p.y,p.sz*2,0,TAU);cx.fill();
    }else{cx.fillStyle=p.col;cx.fillRect(p.x-1.5,p.y-1.5,p.sz||3,p.sz||3);}
  }
  cx.globalAlpha=1;cx.globalCompositeOperation='source-over';

  // damage numbers
  cx.textAlign='center';
  for(const n of G.dmgNums){
    cx.globalAlpha=Math.min(1,n.life*1.6);
    if(n.crit){
      cx.font='bold 21px Orbitron,monospace';
      cx.shadowColor='#ffdd00';cx.shadowBlur=10;
      cx.fillStyle='#ffdd44';cx.fillText(n.v+'!',n.x,n.y);cx.shadowBlur=0;
    }else{
      cx.font='bold 14px Orbitron,monospace';
      cx.fillStyle='#fff';cx.fillText(n.v,n.x,n.y);
    }
  }
  cx.globalAlpha=1;
  // floats
  cx.textAlign='center';cx.font='bold 15px Orbitron,monospace';
  for(const f of G.floats){cx.globalAlpha=Math.min(1,f.life);cx.fillStyle=f.col;cx.fillText(f.txt,f.x,f.y);}
  cx.globalAlpha=1;
  cx.restore();

  // --- screen-edge damage direction indicators ---
  if(state===ST.PLAY&&G.dmgDir&&G.dmgDir.length){
    for(const d of G.dmgDir){
      const al=Math.min(1,d.life*1.6);
      // convert world-relative hit angle to screen edge (camera is unrotated)
      const a=d.ang;
      cx.save();cx.translate(W/2,H/2);
      const grd=cx.createRadialGradient(0,0,Math.min(W,H)*0.30,0,0,Math.min(W,H)*0.52);
      grd.addColorStop(0,'rgba(255,40,60,0)');
      grd.addColorStop(1,'rgba(255,40,60,'+(al*0.5)+')');
      cx.rotate(a);
      cx.fillStyle=grd;
      cx.beginPath();cx.moveTo(0,0);
      cx.arc(0,0,Math.max(W,H),-0.5,0.5);cx.closePath();cx.fill();
      cx.restore();
    }
  }
  // white flash on big events
  if(flash>0){cx.fillStyle='rgba(255,240,240,'+flash*0.35+')';cx.fillRect(0,0,W,H);}
  // unified color grade + vignette (ties the whole scene together)
  grade();
  // low hull warning
  if(G.hull/G.maxHull<0.3&&state===ST.PLAY){
    const p=(Math.sin(G.lowHullPulse*6)+1)/2;
    cx.strokeStyle='rgba(255,20,40,'+(0.25+p*0.4)+')';cx.lineWidth=6;
    cx.strokeRect(3,3,W-6,H-6);
  }

  // off-screen enemy direction indicators
  if(state===ST.PLAY){
    for(const e of G.enemies){
      const dx=e.x-G.px,dy=e.y-G.py;
      const sxp=W/2+dx,syp=H/2+dy;
      if(sxp>-30&&sxp<W+30&&syp>-30&&syp<H+30)continue;
      const a=Math.atan2(dy,dx);
      const ex=W/2+Math.cos(a)*(Math.min(W,H)*0.44),ey=H/2+Math.sin(a)*(Math.min(W,H)*0.44);
      cx.save();cx.translate(ex,ey);cx.rotate(a);
      const T2=ETYPES[e.type];
      cx.fillStyle=T2.boss||T2.elite?'rgba(255,20,50,0.9)':'rgba(255,80,100,0.55)';
      const s2=T2.boss?12:T2.elite?9:6;
      cx.beginPath();cx.moveTo(s2,0);cx.lineTo(-s2*0.6,-s2*0.6);cx.lineTo(-s2*0.6,s2*0.6);cx.closePath();cx.fill();
      cx.restore();
    }
  }
  drawHUD();
  // --- interactive tutorial prompt ---
  if(G.tut&&state===ST.PLAY){
    const st=TUT_STEPS[G.tut.step]||TUT_STEPS[3];
    cx.textAlign='center';
    const pw=Math.min(760,W*0.8);
    cx.fillStyle='rgba(6,10,16,0.82)';cx.fillRect(W/2-pw/2,H*0.16,pw,66);
    cx.strokeStyle=HUDG;cx.lineWidth=1.5;cx.shadowColor=HUDG;cx.shadowBlur=8;cx.strokeRect(W/2-pw/2,H*0.16,pw,66);cx.shadowBlur=0;
    cx.fillStyle=HUDG;cx.font='bold 10px Orbitron,monospace';
    cx.fillText('▸ FLIGHT TRAINING — STEP '+(G.tut.step+1)+' / 4',W/2,H*0.16+18);
    cx.fillStyle='#eef';cx.font='15px Orbitron,monospace';
    cx.fillText(st.txt,W/2,H*0.16+40);
    cx.fillStyle='#8ab';cx.font='12px Rajdhani,monospace';
    cx.fillText(st.hint,W/2,H*0.16+58);
  }
  // dev / god indicator during play
  if(dev&&state===ST.PLAY){
    cx.textAlign='center';cx.font='bold 11px Orbitron,monospace';
    cx.fillStyle='#33ff88';cx.fillText('DEV'+(G.god?' · GOD':''),W/2,60);
    cx.fillStyle='#2a7';cx.font='8px Orbitron,monospace';
    cx.fillText('G god · H repair · K clear · B boss · N next · L level · J salvage · 1-5 weapons',W/2,72);
  }
  if(state===ST.VERDICT)drawVerdict();
  if(state===ST.PAUSE)drawPause();
  if(state===ST.GAMEOVER)drawEnd(false);
  if(state===ST.VICTORY)drawEnd(true);
  scanlines();
}
function scanlines(){
  if(QUALITY<1)return;   // drop the scanline pass on low-end machines
  cx.fillStyle='rgba(0,0,0,0.07)';
  for(let y=0;y<H;y+=4)cx.fillRect(0,y,W,1);
}
// chamfered military panel
function panel(x,y,w,h,glow){
  const c=10;
  cx.beginPath();
  cx.moveTo(x+c,y);cx.lineTo(x+w,y);cx.lineTo(x+w,y+h-c);cx.lineTo(x+w-c,y+h);cx.lineTo(x,y+h);cx.lineTo(x,y+c);cx.closePath();
  cx.fillStyle='rgba(8,10,18,0.88)';cx.fill();
  cx.strokeStyle=glow||'rgba(255,34,68,0.8)';cx.lineWidth=1.5;cx.stroke();
  // corner accents
  cx.strokeStyle=glow||'#ff2244';cx.lineWidth=2.5;
  cx.beginPath();cx.moveTo(x+c,y);cx.lineTo(x+c+14,y);cx.stroke();
  cx.beginPath();cx.moveTo(x+w-c,y+h);cx.lineTo(x+w-c-14,y+h);cx.stroke();
}
function btn(x,y,w,h,txt,hot){
  const c=8;
  cx.beginPath();
  cx.moveTo(x-w/2+c,y-h/2);cx.lineTo(x+w/2,y-h/2);cx.lineTo(x+w/2,y+h/2-c);cx.lineTo(x+w/2-c,y+h/2);cx.lineTo(x-w/2,y+h/2);cx.lineTo(x-w/2,y-h/2+c);cx.closePath();
  cx.fillStyle=hot?'rgba(255,34,68,0.3)':'rgba(255,34,68,0.08)';cx.fill();
  cx.strokeStyle='#ff2244';cx.lineWidth=1.5;cx.stroke();
  cx.fillStyle='#fff';cx.font='bold 16px Orbitron,monospace';cx.textAlign='center';
  if(hot){cx.shadowColor='#ff2244';cx.shadowBlur=8;}
  cx.fillText(txt,x,y+6);cx.shadowBlur=0;
}
function glowText(txt,x,y,col,font,blur){
  cx.font=font;cx.textAlign='center';
  cx.shadowColor=col;cx.shadowBlur=blur||14;
  cx.fillStyle=col;cx.fillText(txt,x,y);
  cx.shadowBlur=0;
}
// ============================================================
// ANIMATED BACKDROP — a signature moving set-piece per sector + distant silent warfare
// ============================================================
function bgPos(fx,fy,z){ // far-parallax world→screen, tiled loosely
  return {x:W/2+((fx-G.px*z)%4000+6000)%4000-2000, y:H/2+((fy-G.py*z)%4000+6000)%4000-2000};
}
function drawBackdrop(){
  const g=G, sec=g.sector%3;
  cx.save();
  // ---- SECTOR HERO OBJECT ----
  if(sec===0){
    // Asteroid Graveyard — a distant DYING STAR pulsing on the horizon, tinting the scene
    const P=bgPos(2200,700,0.06), pr=Math.min(W,H)*0.5;
    const pulse=0.75+Math.sin(t*0.5)*0.25;
    const cor=cx.createRadialGradient(P.x,P.y,0,P.x,P.y,pr*pulse);
    cor.addColorStop(0,'rgba(255,180,120,0.5)');cor.addColorStop(0.25,'rgba(255,110,70,0.22)');
    cor.addColorStop(0.6,'rgba(180,60,50,0.08)');cor.addColorStop(1,'rgba(120,30,40,0)');
    cx.fillStyle=cor;cx.beginPath();cx.arc(P.x,P.y,pr*pulse,0,TAU);cx.fill();
    // bright core
    const core=cx.createRadialGradient(P.x,P.y,0,P.x,P.y,pr*0.14);
    core.addColorStop(0,'rgba(255,240,220,0.85)');core.addColorStop(1,'rgba(255,180,120,0)');
    cx.fillStyle=core;cx.beginPath();cx.arc(P.x,P.y,pr*0.14,0,TAU);cx.fill();
    // slow solar flares (rotating spokes)
    cx.globalAlpha=0.12*pulse;cx.strokeStyle='rgba(255,170,110,1)';cx.lineWidth=2;
    for(let k=0;k<8;k++){const a=k/8*TAU+t*0.05;cx.beginPath();cx.moveTo(P.x,P.y);
      cx.lineTo(P.x+Math.cos(a)*pr*(0.5+0.2*Math.sin(t+k)),P.y+Math.sin(a)*pr*(0.5+0.2*Math.sin(t+k)));cx.stroke();}
    cx.globalAlpha=1;
  }else if(sec===1){
    // Minefield Nebula — a huge ROILING RED-VIOLET nebula core, churning bands + inner lightning
    const P=bgPos(1400,-900,0.05), nr=Math.min(W,H)*0.72;
    for(let b=0;b<5;b++){
      const rr=nr*(0.4+b*0.16), off=Math.sin(t*0.15+b*1.4)*40;
      const gr=cx.createRadialGradient(P.x+off,P.y-off*0.5,rr*0.3,P.x,P.y,rr);
      const hue=290-b*14;
      gr.addColorStop(0,'hsla('+hue+',70%,45%,'+(0.10-b*0.012)+')');gr.addColorStop(1,'hsla('+hue+',70%,40%,0)');
      cx.fillStyle=gr;cx.beginPath();cx.arc(P.x+off,P.y,rr,0,TAU);cx.fill();
    }
    // inner cloud lightning flickers
    if(Math.random()<0.02){cx.fillStyle='rgba(220,180,255,0.18)';cx.beginPath();cx.arc(P.x+rand(-nr*0.3,nr*0.3),P.y+rand(-nr*0.3,nr*0.3),rand(20,70),0,TAU);cx.fill();}
  }else{
    // Derelict Shipyard — skeletal DRY-DOCK GANTRY framing a half-built dreadnought with worklights
    const P=bgPos(-1600,-1100,0.12);
    cx.save();cx.translate(P.x,P.y);
    const w=Math.min(W,H)*0.9,h=w*0.5;
    // half-built dreadnought hull silhouette
    cx.fillStyle='rgba(24,26,34,0.75)';cx.strokeStyle='rgba(70,80,100,0.4)';cx.lineWidth=2;
    shipPath([w*0.55,0, w*0.2,-h*0.2, -w*0.3,-h*0.22, -w*0.55,-h*0.1, -w*0.5,0, -w*0.55,h*0.1, -w*0.3,h*0.22, w*0.2,h*0.2]);
    cx.fill();cx.stroke();
    // gantry scaffolding around it
    cx.strokeStyle='rgba(90,105,130,0.35)';cx.lineWidth=3;
    cx.strokeRect(-w*0.6,-h*0.35,w*1.2,h*0.7);
    for(let k=0;k<9;k++){const gx=-w*0.6+k*w*1.2/8;cx.beginPath();cx.moveTo(gx,-h*0.35);cx.lineTo(gx,h*0.35);cx.stroke();}
    // flickering worklights + welding sparks
    for(let k=0;k<10;k++){const lx=rand(-w*0.5,w*0.5),ly=rand(-h*0.2,h*0.2);
      if(Math.sin(t*3+k*2)>0.3){cx.fillStyle='rgba(255,'+(180+k*6)+',120,0.5)';cx.fillRect(lx,ly,3,3);}}
    if(Math.random()<0.06){cx.fillStyle='rgba(180,220,255,0.6)';cx.fillRect(rand(-w*0.4,w*0.4),rand(-h*0.15,h*0.15),2,2);}
    cx.restore();
  }
  // ---- DISTANT SILENT WARFARE — a battle raging far beyond your fight ----
  if(!g.warBase){g.warBase={x:rand(-2000,2000),y:rand(-2000,2000)};g.warFlashes=[];}
  const WB=bgPos(g.warBase.x,g.warBase.y,0.09);
  // occasional silent flashes
  if(Math.random()<0.05)g.warFlashes.push({x:WB.x+rand(-160,160),y:WB.y+rand(-90,90),life:0.5,r:rand(4,14)});
  for(let i=g.warFlashes.length-1;i>=0;i--){const f=g.warFlashes[i];f.life-=1/60;
    if(f.life<=0){g.warFlashes.splice(i,1);continue;}
    const al=f.life*2*(1/(1+Math.random()));
    const gr=cx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*3);
    gr.addColorStop(0,'rgba(255,220,180,'+Math.min(0.5,f.life)+')');gr.addColorStop(1,'rgba(255,120,80,0)');
    cx.fillStyle=gr;cx.beginPath();cx.arc(f.x,f.y,f.r*3,0,TAU);cx.fill();
  }
  // faint tracer streaks between the distant fleets
  if(Math.random()<0.08){cx.strokeStyle='rgba(255,200,150,0.15)';cx.lineWidth=1;
    const a=rand(0,TAU),len=rand(40,120);cx.beginPath();cx.moveTo(WB.x,WB.y);cx.lineTo(WB.x+Math.cos(a)*len,WB.y+Math.sin(a)*len);cx.stroke();}
  cx.restore();
}
const HUDG='#5dff9e';   // phosphor HUD green
function drawJetHUD(){
  const g=G;
  cx.save();
  cx.strokeStyle=HUDG;cx.fillStyle=HUDG;
  cx.shadowColor=HUDG;cx.shadowBlur=6;cx.lineWidth=1.3;
  cx.font='11px Orbitron,monospace';cx.textAlign='left';
  const cxp=W/2, cyp=H/2;

  // (boresight reticle removed — kept the HUD off the player's own hull)
  const spd=Math.hypot(g.pvx,g.pvy);

  // --- minimal target markers: subtle brackets only on notable ships + one soft lock ---
  cx.shadowBlur=4;
  let locked=null,lockD=1e9;
  for(const e of g.enemies){
    const sx=cxp+(e.x-g.px), sy=cyp+(e.y-g.py);
    if(sx<-40||sx>W+40||sy<-40||sy>H+40)continue;
    const d=Math.hypot(e.x-g.px,e.y-g.py);
    if(d<lockD){lockD=d;locked={e,sx,sy,d};}
    // only bracket the big threats — swarms stay uncluttered
    if(e.type!=='boss'&&e.type!=='tyrant'&&e.type!=='cruiser')continue;
    const s=Math.max(12,e.r+8);cx.globalAlpha=0.5;cx.lineWidth=1.2;
    const L=s*0.45;
    for(const [ox,oy] of [[-1,-1],[1,-1],[1,1],[-1,1]]){
      cx.beginPath();
      cx.moveTo(sx+ox*s,sy+oy*s-oy*L);cx.lineTo(sx+ox*s,sy+oy*s);cx.lineTo(sx+ox*s-ox*L,sy+oy*s);cx.stroke();
    }
  }
  // soft lock diamond on the nearest threat (no text clutter)
  if(locked){
    const {sx,sy,e}=locked, s=Math.max(11,e.r+7);cx.globalAlpha=0.7;cx.lineWidth=1.3;
    const dd=5;cx.beginPath();cx.moveTo(sx,sy-s-dd);cx.lineTo(sx+dd,sy-s);cx.lineTo(sx,sy-s+dd);cx.lineTo(sx-dd,sy-s);cx.closePath();cx.stroke();
  }
  cx.shadowBlur=0;cx.globalAlpha=1;cx.restore();
}

function wrapText(txt,x,y,maxW,lh){
  const words=txt.split(' ');let line='',yy=y;
  for(const w of words){const test=line?line+' '+w:w;
    if(cx.measureText(test).width>maxW){cx.fillText(line,x,yy);line=w;yy+=lh;}
    else line=test;}
  cx.fillText(line,x,yy);
}

// left-aligned word wrap
function wrapLeft(txt,x,y,maxW,lh){
  cx.textAlign='left';
  const words=txt.split(' ');let line='',yy=y;
  for(const w of words){const test=line?line+' '+w:w;
    if(cx.measureText(test).width>maxW){cx.fillText(line,x,yy);line=w;yy+=lh;}else line=test;}
  cx.fillText(line,x,yy);
}

// ============================================================
// MAIN LOOP
// ============================================================
let last=performance.now();
function frame(now){
  let dt=Math.min(0.05,(now-last)/1000);last=now;
  try{pollGamepad();}catch(e){}
  updateQuality(dt);
  if(hitstop>0){hitstop-=dt;dt*=0.08;}   // frame freeze on heavy impacts
  // robustness: one bad frame must never white-screen the whole game
  try{
    updateMusic(Math.min(0.05,dt||0.016));
    update(dt);
    draw();
  }catch(err){
    if(!frame._warned){console.error('BLACKBOX frame error:',err);frame._warned=true;}
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
